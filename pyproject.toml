[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jevcompact"
version = "0.1.0"
description = "Session Compaction using Jev: keep, truncate or drop old tool results with calibrated scores."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "tiktoken>=0.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "cryptography>=42",
  "keyring>=25",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  "hypothesis>=6.100",
  "jevcompact[server]",
]

[project.scripts]
jevcompact = "jevcompact.cli:main"

[tool.setuptools.packages.find]
include = ["jevcompact*", "server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "perf: performance measurements (NFR)",
  "live: needs real API keys; skipped otherwise",
]
